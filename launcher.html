<!DOCTYPE html>
<html>
<head>
    <title>Loading...</title>

    <script>
        function launch() {

            // Get settings from localStorage
            const tabName =
                localStorage.getItem("tabName") || "about:blank";

            const tabIcon =
                localStorage.getItem("tabIcon") || "";


            // Open a new tab at about:blank
            const newWindow = window.open("about:blank", "_blank");

            // Check if the browser blocked the popup
            if (!newWindow) {
                document.body.innerHTML =
                    "<h2>Please allow pop-ups for this site.</h2>";
                return;
            }


            // Find index.html relative to the launcher
            const indexURL = new URL(
                "index.html",
                window.location.href
            ).href;


            // Only allow the Google Drive icon
            const googleDriveIcon =
                "https://ssl.gstatic.com/docs/doclist/images/infinite_arrow_favicon_5.ico";

            let iconHTML = "";

            if (tabIcon === googleDriveIcon) {
                iconHTML = `
                    <link
                        rel="icon"
                        href="${googleDriveIcon}"
                    >
                `;
            }


            // Create the about:blank page
            newWindow.document.open();

            newWindow.document.write(`
                <!DOCTYPE html>
                <html>
                <head>

                    <title>${escapeHTML(tabName)}</title>

                    ${iconHTML}

                    <style>
                        html, body {
                            margin: 0;
                            padding: 0;
                            width: 100%;
                            height: 100%;
                            overflow: hidden;
                            background: black;
                        }

                        iframe {
                            width: 100%;
                            height: 100%;
                            border: none;
                            display: block;
                        }
                    </style>

                </head>

                <body>

                    <iframe
                        src="${escapeAttribute(indexURL)}"
                        allowfullscreen>
                    </iframe>

                </body>
                </html>
            `);

            newWindow.document.close();


            // Send the original launcher tab to Google
            window.location.href = "https://www.google.com";
        }


        function escapeHTML(text) {
            return String(text)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }


        function escapeAttribute(text) {
            return String(text)
                .replace(/&/g, "&amp;")
                .replace(/"/g, "&quot;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");
        }


        // Launch automatically when the page loads
        window.onload = launch;
    </script>
</head>

<body>

    <h2>Launching Sigma Jello...</h2>

</body>
</html>
