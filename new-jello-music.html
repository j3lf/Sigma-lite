<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>New Jello Music</title>
    <style>
        :root {
            color-scheme: dark;
            --panel: #121212;
            --muted: #b3b3b3;
            --accent: #50e484;
        }

        * { box-sizing: border-box; }

        body {
            display: grid;
            grid-template-columns: minmax(210px, 270px) minmax(0, 1fr);
            grid-template-rows: minmax(0, 1fr) auto;
            gap: 8px;
            height: 100dvh;
            margin: 0;
            padding: 8px;
            background: #080808;
            color: #fafafa;
            font-family: Inter, "Segoe UI", sans-serif;
        }

        a { color: inherit; }
        button, input { font: inherit; }
        button { cursor: pointer; }
        button:disabled { cursor: default; opacity: .4; }
        :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

        .library, main {
            min-height: 0;
            overflow: auto;
            border-radius: 10px;
            background: var(--panel);
        }

        .library { padding: 24px 20px; }
        .home-link { color: var(--muted); font-size: .875rem; text-decoration: none; }
        .home-link:hover { color: white; }
        .library h2 { margin: 28px 0 6px; font-size: 1.1rem; }
        .track-count, #queue-message { color: var(--muted); font-size: .875rem; }
        .track-count { margin: 0 0 22px; }

        .playlists {
            display: grid;
            gap: 8px;
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid #303030;
        }

        .playlists h2 { margin: 0; }
        .playlist-form, .playlist-actions, .queue-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
        }

        .queue-header { justify-content: space-between; }
        .playlist-actions { margin-bottom: 16px; }
        .playlist-form input { flex: 1; min-width: 0; }
        #playlist-status:empty, .playlist-actions[hidden] { display: none; }
        #playlist-status { margin: 0; color: var(--muted); font-size: .875rem; }
        #playlist-select, #playlist-track { max-width: 100%; }

        .playlist-control {
            padding: 8px 10px;
            border: 1px solid #424242;
            border-radius: 6px;
            background: #202020;
            color: inherit;
        }

        .track-row { display: flex; align-items: center; gap: 8px; }
        .track-row .track { flex: 1; min-width: 0; }
        .unavailable-track { padding: 12px; color: var(--muted); overflow-wrap: anywhere; }

        #audio-files {
            width: 100%;
            margin-top: 8px;
            color: var(--muted);
            font-size: .8rem;
        }

        #audio-files::file-selector-button {
            display: block;
            margin: 0 0 8px;
            padding: 9px 15px;
            border: 0;
            border-radius: 100px;
            background: #303030;
            color: white;
            cursor: pointer;
            font: inherit;
            font-weight: 650;
        }

        .hero {
            display: flex;
            align-items: flex-end;
            gap: clamp(16px, 3vw, 32px);
            padding: clamp(20px, 4vw, 48px);
            background: linear-gradient(135deg, #354b67, #192432 70%, var(--panel));
        }

        .cover {
            display: block;
            width: clamp(70px, 19vw, 192px);
            aspect-ratio: 1;
            border-radius: 6px;
            object-fit: cover;
            box-shadow: 0 12px 30px #0008;
        }

        h1 {
            margin: 0;
            font-size: clamp(1.7rem, 5.5vw, 5rem);
            line-height: 1;
            letter-spacing: -.045em;
        }

        .queue-section { padding: 12px clamp(16px, 4vw, 48px) 32px; }
        .queue-section h2 { margin: 8px 0 18px; font-size: 1.25rem; }
        #queue-message:empty { display: none; }
        #queue { padding-left: 2rem; }
        #queue li { padding-left: 8px; }
        #queue li::marker { color: var(--muted); font-variant-numeric: tabular-nums; }

        .track {
            width: 100%;
            padding: 12px;
            border: 0;
            border-bottom: 1px solid #282828;
            border-radius: 4px;
            background: transparent;
            color: inherit;
            font-weight: 600;
            text-align: left;
            overflow-wrap: anywhere;
        }

        .track:hover, .track[aria-current="true"] { background: #252525; }
        .track[aria-current="true"] { color: var(--accent); }

        .player-bar {
            grid-column: 1 / -1;
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(220px, 2fr) minmax(0, 1fr);
            align-items: center;
            gap: 16px;
            padding: 10px 16px;
        }

        .now-playing-label { color: var(--muted); font-size: .75rem; }
        #now-playing { margin: 4px 0 0; overflow-wrap: anywhere; font-size: .9rem; }
        .transport { display: flex; justify-content: center; align-items: center; gap: 12px; }

        .transport button {
            width: 38px;
            height: 38px;
            border: 0;
            border-radius: 50%;
            background: transparent;
            color: white;
        }

        .transport button:hover:not(:disabled) { background: #282828; }
        .transport #play-pause { background: var(--accent); color: #08160d; }
        .transport #play-pause:hover:not(:disabled) { background: #7bf0a3; }

        .timeline {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr) auto;
            align-items: center;
            gap: 10px;
            margin-top: 4px;
            color: var(--muted);
            font-size: .75rem;
            font-variant-numeric: tabular-nums;
        }

        input[type="range"] { width: 100%; margin: 0; accent-color: var(--accent); }
        .volume { display: flex; align-items: center; gap: 8px; justify-self: end; font-size: .8rem; }
        .volume input { width: clamp(50px, 8vw, 110px); }

        @media (max-width: 640px) {
            body {
                grid-template-columns: minmax(0, 1fr);
                grid-template-rows: auto minmax(0, 1fr) auto;
            }

            .library { max-height: 42dvh; padding: 12px 16px; }
            .library h2 { display: inline-block; margin: 0 8px 0 16px; }
            .track-count { display: inline-block; margin: 0; }
            .file-picker { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin-top: 10px; }
            #audio-files { width: min(100%, 225px); margin: 0; }
            #audio-files::file-selector-button { display: inline-block; margin: 0 8px 0 0; }
            .player-bar { grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; padding: 6px 8px; }
            .player-controls { grid-row: 2; grid-column: 1 / -1; }
            .volume { grid-column: 2; grid-row: 1; }
        }
    </style>
</head>
<body>
    <aside class="library" aria-label="Library">
        <a class="home-link" href="index.html">← Back to Jello</a>
        <h2>Your Library</h2>
        <p class="track-count" id="track-count">0 tracks</p>
        <div class="file-picker">
            <label for="audio-files">Add session tracks</label>
            <input id="audio-files" type="file" accept="audio/*,.mp3,.m4a,.ogg,.wav,.flac" multiple>
        </div>
        <section class="playlists" aria-labelledby="playlists-heading">
            <h2 id="playlists-heading">Playlists</h2>
            <select id="playlist-select" class="playlist-control" aria-label="Choose a playlist">
                <option value="">All tracks</option>
            </select>
            <form id="playlist-form" class="playlist-form">
                <input id="playlist-name" class="playlist-control" aria-label="New playlist name"
                    placeholder="Playlist name" maxlength="60" required>
                <button class="playlist-control" type="submit">Create</button>
            </form>
            <p id="playlist-status" role="status"></p>
        </section>
    </aside>

    <main>
        <header class="hero">
            <img class="cover" src="assets/backroundjello.png" alt="">
            <h1>New Jello Music</h1>
        </header>
        <section class="queue-section" aria-labelledby="queue-heading">
            <div class="queue-header">
                <h2 id="queue-heading">Queue</h2>
                <button id="delete-playlist" class="playlist-control" type="button" hidden>Delete playlist</button>
            </div>
            <form id="playlist-actions" class="playlist-actions" hidden>
                <select id="playlist-track" class="playlist-control" aria-label="Track to add"></select>
                <button id="add-playlist-track" class="playlist-control" type="submit">Add track</button>
            </form>
            <p id="queue-message" role="status">Loading saved tracks…</p>
            <ol id="queue"></ol>
        </section>
    </main>

    <footer class="player-bar" aria-label="Playback">
        <div>
            <span class="now-playing-label">Now playing</span>
            <p id="now-playing" aria-live="polite">Select a track</p>
        </div>
        <div class="player-controls">
            <div class="transport">
                <button id="previous" type="button" aria-label="Previous track" disabled>⏮</button>
                <button id="play-pause" type="button" aria-label="Play" disabled>▶</button>
                <button id="next" type="button" aria-label="Next track" disabled>⏭</button>
            </div>
            <div class="timeline">
                <span id="elapsed">0:00</span>
                <input id="seek" type="range" min="0" max="0" step="0.1" value="0" aria-label="Seek" disabled>
                <span id="duration">0:00</span>
            </div>
        </div>
        <label class="volume">Volume
            <input id="volume" type="range" min="0" max="1" step="0.01" value="1">
        </label>
        <audio id="player" preload="metadata"></audio>
    </footer>
    <script>
        const player = document.getElementById("player");
        const nowPlaying = document.getElementById("now-playing");
        const queue = document.getElementById("queue");
        const queueMessage = document.getElementById("queue-message");
        const files = document.getElementById("audio-files");
        const trackCount = document.getElementById("track-count");
        const previous = document.getElementById("previous");
        const playPause = document.getElementById("play-pause");
        const next = document.getElementById("next");
        const seek = document.getElementById("seek");
        const elapsed = document.getElementById("elapsed");
        const duration = document.getElementById("duration");
        const volume = document.getElementById("volume");
        const playlistSelect = document.getElementById("playlist-select");
        const playlistForm = document.getElementById("playlist-form");
        const playlistName = document.getElementById("playlist-name");
        const playlistStatus = document.getElementById("playlist-status");
        const playlistActions = document.getElementById("playlist-actions");
        const playlistTrack = document.getElementById("playlist-track");
        const addPlaylistTrack = document.getElementById("add-playlist-track");
        const deletePlaylist = document.getElementById("delete-playlist");
        const queueHeading = document.getElementById("queue-heading");
        const playlistKey = "newJelloMusicPlaylists";
        const tracks = new Map();
        const playlists = loadPlaylists();
        let selectedPlaylist = null;
        let playingPlaylist = null;
        let libraryMessage = "Loading saved tracks…";
        let currentTrack = null;
        let currentURL;

        function loadPlaylists() {
            try {
                const saved = JSON.parse(localStorage.getItem(playlistKey));
                return Array.isArray(saved) ? saved : [];
            } catch {
                playlistStatus.textContent = "Saved playlists are unavailable.";
                return [];
            }
        }

        function savePlaylists() {
            try {
                localStorage.setItem(playlistKey, JSON.stringify(playlists));
                playlistStatus.textContent = "";
            } catch {
                playlistStatus.textContent = "Changes could not be saved for your next visit.";
            }
        }

        function getTracks(playlist) {
            if (!playlist) {
                return [...tracks.values()];
            }
            return playlist.tracks.map(track => tracks.get(track.id)).filter(Boolean);
        }

        function updateTransport() {
            const playback = getTracks(playingPlaylist);
            const index = playback.indexOf(currentTrack);
            previous.disabled = index <= 0;
            next.disabled = !currentTrack || index >= playback.length - 1;
            playPause.disabled = !currentTrack && getTracks(selectedPlaylist).length === 0;
            const paused = player.paused || player.ended;
            playPause.textContent = paused ? "▶" : "Ⅱ";
            playPause.setAttribute("aria-label", paused ? "Play" : "Pause");
        }

        function formatTime(seconds) {
            const wholeSeconds = Math.floor(seconds);
            return Math.floor(wholeSeconds / 60) + ":" + String(wholeSeconds % 60).padStart(2, "0");
        }

        function updateTimeline() {
            const length = Number.isFinite(player.duration) ? player.duration : 0;
            seek.disabled = length === 0;
            seek.max = length;
            seek.value = player.currentTime;
            elapsed.textContent = formatTime(player.currentTime);
            duration.textContent = formatTime(length);
        }

        function startPlayback() {
            const track = currentTrack;
            nowPlaying.textContent = track.name;
            player.play().catch(error => {
                if (currentTrack === track && error.name !== "AbortError") {
                    nowPlaying.textContent = "Unable to play " + track.name;
                }
            });
        }

        function playTrack(track) {
            queue.querySelector('[aria-current="true"]')?.removeAttribute("aria-current");
            currentTrack = track;
            document.getElementById("track-" + encodeURIComponent(track.id))?.setAttribute("aria-current", "true");

            const previousURL = currentURL;
            currentURL = URL.createObjectURL(track.blob);
            player.src = currentURL;
            if (previousURL) {
                URL.revokeObjectURL(previousURL);
            }
            updateTransport();
            updateTimeline();
            startPlayback();
        }

        function addTrack(id, name, blob) {
            tracks.set(id, { id, name, blob });
        }

        function renderTrack(entry) {
            const item = document.createElement("li");
            const row = document.createElement("div");
            row.className = "track-row";
            const track = tracks.get(entry.id);
            const button = document.createElement("button");
            button.type = "button";
            button.className = "track";
            button.id = "track-" + encodeURIComponent(entry.id);
            button.textContent = entry.name;
            button.disabled = !track;
            if (track) {
                if (track === currentTrack) {
                    button.setAttribute("aria-current", "true");
                }
                button.addEventListener("click", () => {
                    playingPlaylist = selectedPlaylist;
                    playTrack(track);
                });
            } else {
                button.classList.add("unavailable-track");
                button.textContent += " (unavailable)";
            }
            row.appendChild(button);

            if (selectedPlaylist) {
                const playlist = selectedPlaylist;
                const remove = document.createElement("button");
                remove.type = "button";
                remove.className = "playlist-control";
                remove.textContent = "Remove";
                remove.setAttribute("aria-label", "Remove " + entry.name);
                remove.addEventListener("click", () => {
                    playlist.tracks = playlist.tracks.filter(track => track.id !== entry.id);
                    savePlaylists();
                    renderQueue();
                    playlistTrack.focus();
                });
                row.appendChild(remove);
            }
            item.appendChild(row);
            return item;
        }

        function renderQueue() {
            const entries = selectedPlaylist?.tracks ?? [...tracks.values()];
            queueHeading.textContent = selectedPlaylist?.name ?? "Queue";
            queueMessage.textContent = selectedPlaylist
                ? (entries.length ? "" : "Add tracks from your library.")
                : libraryMessage || (tracks.size ? "" : "Add audio files to start listening.");
            if (selectedPlaylist && entries.some(track => track.id.startsWith("session:") && !tracks.has(track.id))) {
                queueMessage.textContent = "Add the original audio files again to play unavailable session tracks.";
            }
            queue.replaceChildren(...entries.map(renderTrack));
            playlistActions.hidden = !selectedPlaylist;
            deletePlaylist.hidden = !selectedPlaylist;

            const included = new Set(entries.map(track => track.id));
            const options = selectedPlaylist
                ? [...tracks.values()].filter(track => !included.has(track.id))
                : [];
            playlistTrack.replaceChildren(...options.map(track => new Option(track.name, track.id)));
            if (!options.length) {
                playlistTrack.add(new Option("No tracks to add", ""));
            }
            playlistTrack.disabled = addPlaylistTrack.disabled = !options.length;
            trackCount.textContent = tracks.size + (tracks.size === 1 ? " track" : " tracks");
            updateTransport();
        }

        function renderPlaylists() {
            playlistSelect.replaceChildren(new Option("All tracks", ""));
            playlists.forEach((playlist, index) => playlistSelect.add(new Option(playlist.name, index)));
            playlistSelect.value = selectedPlaylist ? String(playlists.indexOf(selectedPlaylist)) : "";
            renderQueue();
        }

        playlistSelect.addEventListener("change", () => {
            selectedPlaylist = playlistSelect.value === "" ? null : playlists[Number(playlistSelect.value)];
            renderQueue();
        });

        playlistForm.addEventListener("submit", event => {
            event.preventDefault();
            const name = playlistName.value.trim();
            if (!name || playlists.some(playlist => playlist.name.toLowerCase() === name.toLowerCase())) {
                playlistStatus.textContent = name ? "A playlist with that name already exists." : "Enter a playlist name.";
                playlistName.focus();
                return;
            }
            selectedPlaylist = { name, tracks: [] };
            playlists.push(selectedPlaylist);
            playlistName.value = "";
            savePlaylists();
            renderPlaylists();
        });

        playlistActions.addEventListener("submit", event => {
            event.preventDefault();
            const track = tracks.get(playlistTrack.value);
            if (selectedPlaylist && track && !selectedPlaylist.tracks.some(entry => entry.id === track.id)) {
                selectedPlaylist.tracks.push({ id: track.id, name: track.name });
                savePlaylists();
                renderQueue();
            }
        });

        deletePlaylist.addEventListener("click", () => {
            if (!selectedPlaylist || !window.confirm('Delete "' + selectedPlaylist.name + '"?')) {
                return;
            }
            if (playingPlaylist === selectedPlaylist) {
                playingPlaylist = null;
            }
            playlists.splice(playlists.indexOf(selectedPlaylist), 1);
            selectedPlaylist = null;
            savePlaylists();
            renderPlaylists();
            playlistSelect.focus();
        });

        files.addEventListener("change", () => {
            for (const file of files.files) {
                const id = "session:" + JSON.stringify([file.name, file.size, file.lastModified]);
                if (!tracks.has(id)) {
                    addTrack(id, file.name, file);
                }
            }
            files.value = "";
            renderQueue();
        });

        function skipTrack(offset) {
            const playback = getTracks(playingPlaylist);
            const track = playback[playback.indexOf(currentTrack) + offset];
            if (track) {
                playTrack(track);
            }
        }

        previous.addEventListener("click", () => skipTrack(-1));
        next.addEventListener("click", () => skipTrack(1));
        playPause.addEventListener("click", () => {
            if (!currentTrack) {
                const firstTrack = getTracks(selectedPlaylist)[0];
                if (firstTrack) {
                    playingPlaylist = selectedPlaylist;
                    playTrack(firstTrack);
                }
            } else if (player.paused || player.ended) {
                startPlayback();
            } else {
                player.pause();
            }
        });

        seek.addEventListener("input", () => {
            player.currentTime = Number(seek.value);
        });
        volume.addEventListener("input", () => {
            player.volume = Number(volume.value);
        });

        player.addEventListener("play", updateTransport);
        player.addEventListener("pause", updateTransport);
        player.addEventListener("timeupdate", updateTimeline);
        player.addEventListener("durationchange", updateTimeline);
        player.addEventListener("ended", () => {
            updateTransport();
            skipTrack(1);
        });

        function showLibraryError() {
            libraryMessage = "Saved tracks are unavailable. You can still add audio files.";
            renderQueue();
        }

        // Read the tracks imported by the original Jello Music player.
        function loadSavedTracks() {
            let libraryMissing = false;
            const request = indexedDB.open("JelloMusicDatabase");
            request.onupgradeneeded = () => {
                libraryMissing = true;
                request.transaction.abort();
            };
            request.onerror = () => {
                if (libraryMissing) {
                    showEmptyQueue();
                } else {
                    showLibraryError();
                }
            };
            request.onsuccess = () => {
                const database = request.result;
                if (!database.objectStoreNames.contains("mp3Files")) {
                    database.close();
                    showEmptyQueue();
                    return;
                }

                const transaction = database.transaction("mp3Files", "readonly");
                const library = transaction.objectStore("mp3Files").getAll();
                library.onsuccess = () => {
                    for (const { id, name, blob } of library.result) {
                        addTrack("saved:" + id, name, blob);
                    }
                    showEmptyQueue();
                };
                transaction.onerror = showLibraryError;
                database.close();
            };
        }

        function showEmptyQueue() {
            libraryMessage = "";
            renderQueue();
        }

        renderPlaylists();
        if (window.indexedDB) {
            loadSavedTracks();
        } else {
            showLibraryError();
        }
    </script>
</body>
</html>
